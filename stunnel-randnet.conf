; randnet - TLS tunnel from the dial-up bridge out to the Randnet server.

setuid = stunnel4
setgid = stunnel4


foreground = yes
pid =

[randnet]
client = yes

accept = 0.0.0.0:8443

connect = dd.randnetdd.ch:443

delay = yes

verifyChain = yes
CAfile = /etc/ssl/certs/ca-certificates.crt
checkHost = dd.randnetdd.ch

sslVersionMin = TLSv1.2
