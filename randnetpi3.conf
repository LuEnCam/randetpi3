# randnetpi3 configuration
#
#   sudo install -m 644 randnetpi3.conf /etc/randnetpi3.conf
#   sudo ./randnetpi3.py --config /etc/randnetpi3.conf --dry-run
#
# Every value shown is the built-in default. Empty means "work it out at run
# time". Delete anything you do not need to change.

[modem]

device =

speed = 57600

usb_id =

dial_tone = yes

dial_tone_wav =

answer_delay = 8.0

post_answer_delay = 5.0

reconnect_delay = 5.0


[ppp]

pppd =

peers_name = randnet

local_ip =
peer_ip =


ip_search_start =

chap_client = *
chap_name = Randnet
chap_secret = K1QU0K@N

chap_secret_b64 =

ms_dns =

record_file =

log_file =

extra_options =


[network]
restart_dnsmasq = yes

randnet_redirect = host

randnet_domain = randnet.ne.jp

randnet_hostnames = randnet.ne.jp, www.randnet.ne.jp, peach.randnet.ne.jp,
    dd.randnet.ne.jp, smtp.dd.randnet.ne.jp, pop.dd.randnet.ne.jp

dnsmasq_redirect_file = /etc/dnsmasq.d/randnetpi3-redirect.conf

dns_redirect = 172.16.10.30, 172.16.10.31

# Proxy addresses the console may have been told to use, redirected here to the
# browsing proxy. Two families, because disks disagree:
#
#   172.16.10.40/.41   what a 2001 subscriber disk carries
#   172.116.10.40/.41  what a factory disk carries, and note .41 uses port 8081
#
# A disk keeps whichever it was given and asks for it forever, so both have to be
# caught or that disk's browsing hangs with nothing listening. 172.116.x is
# public address space, so an unmatched request leaves for the real internet and
# retries until the console gives up.
proxy_hosts = 172.16.10.40:8080, 172.16.10.41:8080, 172.116.10.40:8080, 172.116.10.41:8081

# Send every proxy_hosts entry to this port regardless of the port it was
# addressed to. Required, not cosmetic: without it the 172.116.10.41:8081 entry
# above would be redirected to 8081, which is WRP, and proxy traffic would land
# in the wrong server.
proxy_target_port = 8080

transparent_http = yes
transparent_http_port = 8080

manage_etc_hosts = yes

randnet_tls = no

randnet_tls_host =

randnet_tls_port = 443

randnet_tunnel_port = 8443

ppp_interface = ppp+
